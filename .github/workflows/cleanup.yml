name: cleanup-release
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/cleanup.yml' ]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete release and tag
        run: |
          gh release delete pak1-v1 --yes --cleanup-tag || echo "release not found or already deleted"
