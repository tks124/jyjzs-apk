name: cleanup-release
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/cleanup.yml' ]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag via REST
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/tks124/jyjzs-apk/releases/tags/pak1-v1 -o /tmp/rel.json -w "GET release: %{http_code}\n"
          REL_ID=$(python3 -c "import json;print(json.load(open('/tmp/rel.json')).get('id',''))" 2>/dev/null)
          echo "release id: $REL_ID"
          if [ -n "$REL_ID" ]; then
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/tks124/jyjzs-apk/releases/$REL_ID -w "DELETE release: %{http_code}\n"
          fi
          curl -s -X DELETE -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/tks124/jyjzs-apk/git/refs/tags/pak1-v1 -w "DELETE tag: %{http_code}\n"
          curl -s -o /dev/null -w "final GET release: %{http_code}\n" https://api.github.com/repos/tks124/jyjzs-apk/releases/tags/pak1-v1
