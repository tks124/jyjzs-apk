name: Publish PAK1 Data Package

on:
  push:
    paths:
      - '.github/workflows/publish-pak1-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted data package
        run: |
          curl -sL --retry 3 --retry-delay 5 -o PrisonArchitect-PAK1-Data.zip "https://filebin.net/pa-pak1-0124/PrisonArchitect-PAK1-Data.zip"
          ls -l PrisonArchitect-PAK1-Data.zip
          md5sum PrisonArchitect-PAK1-Data.zip

      - name: Create release with asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "=== delete old release ==="
            gh release delete pak1-data-v1 --repo tks124/jyjzs-apk --yes --cleanup-tag 2>&1
            echo "delete_exit=$?"
            echo "=== create release ==="
            gh release create pak1-data-v1 --repo tks124/jyjzs-apk \
              --title "Prison Architect PAK1 加密数据包" \
              --notes "PAK1 加密数据包，密码 0124。文件头为 PAK1，不是 zip。" \
              PrisonArchitect-PAK1-Data.zip 2>&1
            echo "create_exit=$?"
            echo "=== assets ==="
            gh release view pak1-data-v1 --repo tks124/jyjzs-apk 2>&1
          } > ci-status.txt 2>&1
          cat ci-status.txt

      - name: Commit status file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status.txt
          git commit -m "ci: publish status" || true
          git push || true
